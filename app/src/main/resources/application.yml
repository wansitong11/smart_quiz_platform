# Smart Quiz Platform Configuration
# 智能刷题平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 8085
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

spring:
  config:
    import: optional:classpath:voice-interview-opening.yml
  application:
    name: smart-quiz-platform

  # 启用虚拟线程 (Java 21+)
  # 显著提升 I/O 密集型场景的并发能力，特别适合 AI 调用和 SSE 长连接
  threads:
    virtual:
      enabled: true

  # PostgreSQL数据库配置
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart-quiz}
    username: ${POSTGRES_USER:postgres}
    # 与 docker-compose.dev.yml 中 postgres 服务默认一致（本地只起依赖容器 + bootRun 时无需改）
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    # 连接池：加保活 + 明确超时，避免连接被静默掐断时把 postgres 后端也带崩
    # （2026-10-14 事故：客户端异常断连 → pg 后端退出 → 整个集群重建、所有连接断开）
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:10}
      minimum-idle: 2
      keepalive-time: 120000
      max-lifetime: 900000
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      # 预留 multipart 头部开销；业务层单文件上限 50MB
      max-file-size: 55MB
      # 扫描件一次最多 10 张，常规照片远小于 50MB；整批请求上限 200MB
      max-request-size: 200MB
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: ${REDIS_DATABASE:0}
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # Spring AI 配置（chat + embedding 统一由 app.ai.providers 驱动，不使用自动配置）
  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1  # 不重试，失败立即返回
      on-client-errors: false
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024  # text-embedding-v3实际生成的向量维度
        initialize-schema: false # schema 统一由 Flyway 管理
        remove-existing-vector-store-table: false  # 保留现有表和数据

# Application custom configuration
app:
  # 登录鉴权与 RBAC（详见 docs/项目部署/登录鉴权与发布方案.md）
  auth:
    # JWT 签名密钥（HS256，至少 32 字节）。生产必须由环境变量注入，不要写进仓库
    secret: ${APP_AUTH_JWT_SECRET:}
    # 必须是 URL 形态（Spring Security 读取 iss 时会按 URL 解析）
    issuer: ${APP_AUTH_JWT_ISSUER:https://smart-quiz-platform}
    # Access Token 较短，Refresh Token 较长，前端到期自动静默续期
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE_NAME:sq_refresh}
    refresh-cookie-path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
    # 线上必须为 true（HTTPS）；本地 http 调试时在 .env 里置 false
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
    # Swagger 默认不公开，本地需要时置 true
    swagger-public: ${APP_AUTH_SWAGGER_PUBLIC:false}
    bootstrap-admin-username: ${APP_AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    # 留空则首次启动随机生成并打印到日志
    bootstrap-admin-password: ${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    login-rate-limit-per-minute: ${APP_AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:10}
    # 是否开放自助注册；只给少数人用时建议置 false，改为管理员建号
    registration-enabled: ${APP_AUTH_REGISTRATION_ENABLED:true}
    # 自助注册配额：同一来源 IP 24 小时内最多 N 个、全站每天最多 M 个（0 或负数=不限制）
    register-max-per-ip-per-day: ${APP_AUTH_REGISTER_MAX_PER_IP_PER_DAY:3}
    register-max-global-per-day: ${APP_AUTH_REGISTER_MAX_GLOBAL_PER_DAY:5}

  ai:
    # 这里是“无 Key 时的安全默认值”。系统任务、管理员与授权用户使用这组默认模型；
    # 免费档用户由下方 tier 配置强制路由到 3.7，不会自动改写全局默认。
    default-provider: ${APP_AI_DEFAULT_PROVIDER:dashscope}
    default-embedding-provider: ${APP_AI_DEFAULT_EMBEDDING_PROVIDER:dashscope}
    # 识图默认 Provider，必须独立于文本默认：文本模型不接收图片
    default-vision-provider: ${APP_AI_DEFAULT_VISION_PROVIDER:dashscope-vl}
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1024}
    # 旧零价格模型组合的 Provider 标识。现在只用于“零价格模型”并发闸门判定，
    # 不再参与用户档位路由，也不会在启动时自动改写全局默认模型。
    free-models:
      # 免费文本用 Qwen3-8B（实测 8 并发可用）；免费识图用 GLM-4.6V-Flash（免费档约 1 并发）。
      # 这两个指针只决定“免费档默认 Provider”，不是付费档兜底；Key 不存在时不会切换。
      text-provider: ${APP_AI_FREE_TEXT_PROVIDER:siliconflow-free}
      vision-provider: ${APP_AI_FREE_VISION_PROVIDER:glm-vl-free}
      embedding-provider: ${APP_AI_FREE_EMBEDDING_PROVIDER:siliconflow-free}
      # 语音模型没有独立的可切换 Provider 时留空；设置后 ASR/TTS 也按免费闸门限流。
      audio-provider: ${APP_AI_FREE_AUDIO_PROVIDER:}
    # 用户档位路由：免费用户固定走 3.7，管理员/授权用户与系统任务走全局默认（3.8）。
    tier:
      free-text-provider: ${APP_AI_TIER_FREE_TEXT_PROVIDER:dashscope-3.7}
      free-vision-provider: ${APP_AI_TIER_FREE_VISION_PROVIDER:dashscope-3.7-vl}
    # 单次模型调用的整体超时；不设时 HTTP/2 卡住会一直等
    chat-request-timeout: ${APP_AI_CHAT_REQUEST_TIMEOUT:5m}
    vision-request-timeout: ${APP_AI_VISION_REQUEST_TIMEOUT:3m}
    # AI 调用成本观测与控制：账本 / 预算 / 估算 / 价格
    cost:
      enabled: ${APP_AI_COST_ENABLED:true}
      ledger:
        async: true
        retention-days: ${APP_AI_COST_LEDGER_RETENTION_DAYS:90}
        queue-capacity: 10000
        flush-batch-size: 200
        cleanup-cron: "0 10 3 * * ?"
      budget:
        default:
          rpm: ${APP_AI_BUDGET_RPM:10}
          tpm: ${APP_AI_BUDGET_TPM:200000}
          concurrency: ${APP_AI_BUDGET_CONCURRENCY:4}
        features:
          PAPER_IMPORT:
            # 与 paper.recognition.pool-size 对齐，且不得超过 vision-guard.max-in-flight
            concurrency: ${APP_AI_BUDGET_PAPER_IMPORT_CONCURRENCY:3}
            reserve: true
          PAPER_RECOGNIZE:
            concurrency: 2
          PAPER_EXTRACTION:
            reserve: true
          QUIZ_GENERATE:
            rpm: 5
            reserve: true
          ANSWER_EVALUATE:
            reserve: true
          KB_QA:
            reserve: true
        reconciliation-cron: "0 */15 * * * ?"
        stale-reserved-hours: 2
      quota:
        monthly-total-cny: ${APP_AI_QUOTA_MONTHLY_TOTAL_CNY:100}
      estimator:
        default-operation-cny: 0.01
        paper-tokens-per-page: 2000
        quiz-tokens-per-question: 1200
        qa-context-tokens: 4000
        qa-output-tokens: 800
        vectorize-tokens-per-chunk: 800
      prices:
        seed-on-startup: true
        sync-url: ${APP_AI_COST_PRICE_SYNC_URL:}
        local-path: ${APP_AI_COST_PRICE_LOCAL_PATH:}
        sync-cron: ${APP_AI_COST_PRICE_SYNC_CRON:0 20 4 * * ?}
        sync-zone: Asia/Shanghai
    # 单 vision provider 的并发隔离与轻量熔断
    vision-guard:
      max-in-flight: ${APP_AI_VISION_MAX_IN_FLIGHT:4}
      max-queue: ${APP_AI_VISION_MAX_QUEUE:10}
      acquire-timeout: ${APP_AI_VISION_ACQUIRE_TIMEOUT:30s}
      circuit-failure-threshold: ${APP_AI_VISION_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-duration: ${APP_AI_VISION_CIRCUIT_OPEN_DURATION:30s}
      circuit-half-open-probes: ${APP_AI_VISION_CIRCUIT_HALF_OPEN_PROBES:1}
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:true}
      allow-fallback-encryption-key: ${APP_AI_CONFIG_ALLOW_FALLBACK_ENCRYPTION_KEY:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.smart-quiz-platform/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.smart-quiz-platform/llm-providers.env}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_MODEL:qwen3.8-flash}
        embedding-model: text-embedding-v3
        embedding-dimensions: 1024
        supports-embedding: true
        supports-vision: false
      # 识图 Provider：与文本 Provider 同一个 Key / baseUrl，只是模型换成 VL
      dashscope-vl:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        # 兼容模式模型名区分大小写：Qwen3.8-Flash 会 404，必须用 qwen3.8-flash
        model: ${AI_VISION_MODEL:qwen3.8-flash}
        supports-embedding: false
        supports-vision: true
      # 免费用户档位：文本走 3.7，识图同样走 3.7（同名模型支持图片输入）。
      dashscope-3.7:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_FREE_TEXT_MODEL:qwen3.7-flash}
        supports-embedding: false
        supports-vision: false
      dashscope-3.7-vl:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_FREE_VISION_MODEL:qwen3.7-flash}
        supports-embedding: false
        supports-vision: true
      # ===== 免费模型组合（2026-11-03 启用）=====
      # 智谱 GLM：文本先用 GLM-4.7-Flash，识图用 GLM-4.6V-Flash。
      # 两个 Provider 共用同一个 Key；分开建行是因为模型名和能力标记不同。
      glm-free:
        base-url: ${PROVIDER_GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_FREE_MODEL:glm-4.7-flash}
        supports-embedding: false
        supports-vision: false
      glm-vl-free:
        base-url: ${PROVIDER_GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_VISION_FREE_MODEL:glm-4.6v-flash}
        supports-embedding: false
        supports-vision: true
      # 硅基流动：免费文本 Qwen3-8B + Embedding BGE-M3（1024 维）。
      # 同一个 Provider 行同时承担文本和 Embedding，模型能力互不干扰。
      siliconflow-free:
        base-url: ${PROVIDER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${PROVIDER_SILICONFLOW_API_KEY:}
        model: ${PROVIDER_SILICONFLOW_CHAT_MODEL:Qwen/Qwen3-8B}
        embedding-model: ${PROVIDER_SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
        embedding-dimensions: 1024
        supports-embedding: true
        supports-vision: false
      # 硅基流动 DeepSeek V4 Flash：作为备选文本 Provider 保留，供管理员给用户绑定。
      # 与 siliconflow-free 共用同一个 Key / baseUrl，分开建行是因为模型与能力不同。
      siliconflow:
        base-url: ${PROVIDER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${PROVIDER_SILICONFLOW_API_KEY:}
        model: ${PROVIDER_SILICONFLOW_TEXT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
        supports-embedding: false
        supports-vision: false
      # 更便宜的低成本文本档：Qwen3-14B 输入价约为 DeepSeek V4 Flash 的一半、输出同价，
      # 131K 上下文覆盖切题 / 结构化识别 / 批改 / 问答；作为普通用户默认文本档。
      siliconflow-cheap:
        base-url: ${PROVIDER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${PROVIDER_SILICONFLOW_API_KEY:}
        model: ${PROVIDER_SILICONFLOW_CHEAP_TEXT_MODEL:Qwen/Qwen3-14B}
        supports-embedding: false
        supports-vision: false
      siliconflow-vl:
        base-url: ${PROVIDER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${PROVIDER_SILICONFLOW_API_KEY:}
        model: ${PROVIDER_SILICONFLOW_VISION_MODEL:Qwen/Qwen3-VL-8B-Instruct}
        supports-embedding: false
        supports-vision: true
    # 按 Provider 追加请求体参数（不受数据库 Provider 配置影响，一定会生效）
    provider-extra-body:
      dashscope:
        # qwen3.7-plus 默认是"推理模型"，输出里会混入大段思考 token
        # （实测单批 completion 3694 tokens 中 2177 是 reasoning）。
        # 切题、批改、问答这类任务不需要思考链，关掉后单批耗时 64s → 29s、token 省 58%，
        # 也避免单次调用超过 60 秒触发底层 HTTP 客户端的流重置。
        enable_thinking: false
      dashscope-vl:
        # 视觉答案键属于结构化抽取任务，关闭思考链，避免整行图形题响应超过 60 秒。
        enable_thinking: false
      dashscope-3.7:
        enable_thinking: false
      dashscope-3.7-vl:
        enable_thinking: false
      # 智谱 GLM 的思考链开关；结构化抽取 / OCR 不需要深度思考，关闭后更快、输出更干净。
      # 如果后续换成不支持该字段的模型，删掉对应 provider 的这一段即可。
      glm-free:
        thinking:
          type: disabled
      glm-vl-free:
        thinking:
          type: disabled
      # Qwen3-14B 默认开启思考模式；结构化抽取 / 批改不需要思考链，关闭后更快、输出更省。
      siliconflow-cheap:
        enable_thinking: false
      # Qwen3-8B 同样关闭思考链；免费文本档要承担切题 / 解析 / 批改等高频结构化调用。
      siliconflow-free:
        enable_thinking: false
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
        supports-embedding: false
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
        supports-embedding: false
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
        supports-embedding: false
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
        embedding-model: embedding-3
        embedding-dimensions: 1024
        supports-embedding: true
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（用于 BeanOutputConverter 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    # 是否启用 Spring AI 2.0 entity schema validation retry（失败时仍受 structured-max-attempts 外层控制）
    structured-schema-validation-enabled: ${APP_AI_STRUCTURED_SCHEMA_VALIDATION_ENABLED:true}
    # 可重试失败（限流、超时、连接中断）的退避基础时长
    structured-retry-backoff-base-ms: ${APP_AI_STRUCTURED_RETRY_BACKOFF_BASE_MS:1000}
    # 退避时长上限，避免重试等待无限增长
    structured-retry-backoff-max-ms: ${APP_AI_STRUCTURED_RETRY_BACKOFF_MAX_MS:5000}
    # 退避随机抖动上限，避免多个 worker 同时重试
    structured-retry-backoff-jitter-ms: ${APP_AI_STRUCTURED_RETRY_BACKOFF_JITTER_MS:500}
    # 上游 429 的默认退避；如果响应带 Retry-After，会优先使用响应头
    structured-rate-limit-backoff-base-ms: ${APP_AI_STRUCTURED_RATE_LIMIT_BACKOFF_BASE_MS:5000}
    structured-rate-limit-backoff-max-ms: ${APP_AI_STRUCTURED_RATE_LIMIT_BACKOFF_MAX_MS:20000}
    structured-rate-limit-backoff-jitter-ms: ${APP_AI_STRUCTURED_RATE_LIMIT_BACKOFF_JITTER_MS:1000}
    # 单次 429 等待上限，避免 Stream worker 长时间占住
    structured-rate-limit-max-wait-ms: ${APP_AI_STRUCTURED_RATE_LIMIT_MAX_WAIT_MS:30000}
    # 免费模型统一并发闸门：按实际 Provider 价格判断是否免费，所有用户共享全局许可。
    # 文本 / 识图 / Embedding / 音频分别限流；付费模型不等待。
    free-model-concurrency:
      enabled: ${APP_AI_FREE_MODEL_CONCURRENCY_ENABLED:true}
      text-permits: ${APP_AI_FREE_MODEL_TEXT_PERMITS:1}
      vision-permits: ${APP_AI_FREE_MODEL_VISION_PERMITS:1}
      embedding-permits: ${APP_AI_FREE_MODEL_EMBEDDING_PERMITS:1}
      audio-permits: ${APP_AI_FREE_MODEL_AUDIO_PERMITS:1}
      # 免费文本模型下解析批大小；仅影响试卷解析，不改变其它调用
      analysis-batch-size: ${APP_AI_FREE_MODEL_ANALYSIS_BATCH_SIZE:4}
      # Provider 级覆盖；未列出的 Provider 使用上面的模态默认值。
      provider-permits:
        siliconflow-free:
          # Qwen3-8B 实测 8 并发仍能返回完整结构化结果
          text-permits: ${APP_AI_FREE_MODEL_SILICONFLOW_TEXT_PERMITS:8}
          embedding-permits: ${APP_AI_FREE_MODEL_SILICONFLOW_EMBEDDING_PERMITS:1}
        glm-free:
          text-permits: ${APP_AI_FREE_MODEL_GLM_TEXT_PERMITS:1}
        glm-vl-free:
          # GLM-4.6V-Flash 免费档实测约 1 并发
          vision-permits: ${APP_AI_FREE_MODEL_GLM_VISION_PERMITS:1}
    # 付费 Provider 的独立并发保护；未列出的 Provider 不受影响。
    # 免费模型已经由上面的零价格闸门限制，这里主要用于付费识图的厂商侧配额。
    provider-concurrency:
      enabled: ${APP_AI_PROVIDER_CONCURRENCY_ENABLED:true}
      providers:
        siliconflow-vl:
          # 纸卷页任务默认 3 并发；该模型在 3 并发下实测会连续返回 429。
          # 先串行到 1，页任务仍可并行准备图片 / 等待许可，不再同时打上游。
          vision-permits: ${APP_AI_PROVIDER_SILICONFLOW_VL_PERMITS:1}
    # 免费模型或 Provider 级限流配置命中时的上游 429 进程内共享冷却
    rate-limit-throttle:
      enabled: ${APP_AI_RATE_LIMIT_THROTTLE_ENABLED:true}
      fallback-base-ms: ${APP_AI_RATE_LIMIT_THROTTLE_BASE_MS:10000}
      fallback-jitter-ms: ${APP_AI_RATE_LIMIT_THROTTLE_JITTER_MS:2000}
      max-wait-ms: ${APP_AI_RATE_LIMIT_THROTTLE_MAX_WAIT_MS:30000}
    rag:
      # RAG 业务指标（app.rag.*）开关
      metrics-enabled: ${APP_AI_RAG_METRICS_ENABLED:true}
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
      search:
        # 双路召回融合（改写 Query 与原始 Query），测评证明收益前默认关闭
        merge-original-query: ${APP_AI_RAG_MERGE_ORIGINAL_QUERY:false}
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
      # 向量化 Chunk 策略（仅 Spring AI 2.0 原生参数，无 overlap；调整后需重新向量化）
      vectorization:
        splitter: ${APP_AI_RAG_VECTORIZATION_SPLITTER:token}
        chunk-size: ${APP_AI_RAG_VECTORIZATION_CHUNK_SIZE:800}
        min-chunk-size-chars: ${APP_AI_RAG_VECTORIZATION_MIN_CHUNK_SIZE_CHARS:350}
        min-chunk-length-to-embed: ${APP_AI_RAG_VECTORIZATION_MIN_CHUNK_LENGTH_TO_EMBED:5}
        max-num-chunks: ${APP_AI_RAG_VECTORIZATION_MAX_NUM_CHUNKS:10000}
        keep-separator: ${APP_AI_RAG_VECTORIZATION_KEEP_SEPARATOR:true}
        punctuation-marks: ${APP_AI_RAG_VECTORIZATION_PUNCTUATION_MARKS:.,?,!,\\n,。,？,！,；}
        strategy-version: ${APP_AI_RAG_VECTORIZATION_STRATEGY_VERSION:token-v1}
      # 知识库识图：图片 / 扫描 PDF / DOCX 内嵌图
      ocr:
        enabled: ${APP_AI_RAG_OCR_ENABLED:true}
        max-pages: ${APP_AI_RAG_OCR_MAX_PAGES:10}
        max-docx-images: ${APP_AI_RAG_OCR_MAX_DOCX_IMAGES:40}

  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
      # 批次失败后按问答组二分重试（共享额外调用预算）
      fallback-split-enabled: ${APP_INTERVIEW_EVALUATION_FALLBACK_SPLIT_ENABLED:true}
      fallback-max-extra-calls: ${APP_INTERVIEW_EVALUATION_FALLBACK_MAX_EXTRA_CALLS:6}
      fallback-min-groups: ${APP_INTERVIEW_EVALUATION_FALLBACK_MIN_GROUPS:2}
    question-inner:
      executor:
        pool-size: ${APP_INTERVIEW_QUESTION_INNER_POOL_SIZE:4}
        queue-capacity: ${APP_INTERVIEW_QUESTION_INNER_QUEUE_CAPACITY:20}
        rejection-policy: ${APP_INTERVIEW_QUESTION_INNER_REJECTION_POLICY:abort}
  # 模拟测验组卷约束（详见 docs/design/模拟测验模块改造方案.md）
  # 这些上限不只是体验问题：单次模型调用越大越慢，越容易撞上
  # 底层 HTTP 客户端「60 秒无响应即重置流」的问题
  quiz:
    max-questions: ${APP_QUIZ_MAX_QUESTIONS:12}
    min-questions: ${APP_QUIZ_MIN_QUESTIONS:3}
    max-questions-per-section: ${APP_QUIZ_MAX_QUESTIONS_PER_SECTION:6}
    max-material-chars-per-material: ${APP_QUIZ_MAX_MATERIAL_CHARS:1200}
    max-reading-material-chars-per-material: ${APP_QUIZ_MAX_READING_MATERIAL_CHARS:4000}
    max-total-material-chars: ${APP_QUIZ_MAX_TOTAL_MATERIAL_CHARS:6000}
    max-long-reading-sections-per-paper: ${APP_QUIZ_MAX_LONG_READING_SECTIONS:1}
    max-question-stem-chars: ${APP_QUIZ_MAX_STEM_CHARS:600}
    max-option-chars: ${APP_QUIZ_MAX_OPTION_CHARS:200}
    wrong-book-subjective-correct-threshold: ${APP_QUIZ_WRONG_BOOK_SUBJECTIVE_CORRECT_THRESHOLD:80}
    wrong-book-random-retry-count: ${APP_QUIZ_WRONG_BOOK_RANDOM_RETRY_COUNT:10}
    wrong-book-max-retry-questions: ${APP_QUIZ_WRONG_BOOK_MAX_RETRY_QUESTIONS:20}
  resume:
    upload-dir: ${java.io.tmpdir}/smart-quiz-platform/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # 试卷 / 练习材料结构化切题
  paper:
    upload:
      # 单份试卷允许的视觉识别物理页上限（图片 / 扫描页）
      max-vision-pages: ${APP_PAPER_UPLOAD_MAX_VISION_PAGES:10}
      # 纯文字材料合并后的字符上限，超出拒绝（防止极端输入打爆切题上下文）
      max-text-chars: ${APP_PAPER_UPLOAD_MAX_TEXT_CHARS:30000}
    recognition:
      # 单卷内图片页并行；上限必须与 app.ai.vision-guard.max-in-flight 对齐
      pool-size: ${APP_PAPER_RECOGNITION_POOL_SIZE:3}
      queue-capacity: ${APP_PAPER_RECOGNITION_QUEUE_CAPACITY:20}
      rejection-policy: ${APP_PAPER_RECOGNITION_REJECTION_POLICY:abort}
      propagate-security-context: ${APP_PAPER_RECOGNITION_PROPAGATE_SECURITY_CONTEXT:true}
      propagate-ai-call-context: ${APP_PAPER_RECOGNITION_PROPAGATE_AI_CALL_CONTEXT:true}
      heartbeat-interval: ${APP_PAPER_RECOGNITION_HEARTBEAT_INTERVAL:30s}
      page-stale-threshold: ${APP_PAPER_RECOGNITION_PAGE_STALE_THRESHOLD:10m}
      max-vision-calls-per-page: ${APP_PAPER_RECOGNITION_MAX_VISION_CALLS_PER_PAGE:3}
      output-truncated-retry-max-count: ${APP_PAPER_RECOGNITION_OUTPUT_TRUNCATED_RETRY_MAX_COUNT:1}
      two-stage-recognition-enabled: ${APP_PAPER_RECOGNITION_TWO_STAGE_ENABLED:false}
      invalid-output-retry-threshold: ${APP_PAPER_RECOGNITION_INVALID_OUTPUT_RETRY_THRESHOLD:2}
      invalid-output-fallback-enabled: ${APP_PAPER_RECOGNITION_INVALID_OUTPUT_FALLBACK_ENABLED:true}
      invalid-output-fallback-max-calls: ${APP_PAPER_RECOGNITION_INVALID_OUTPUT_FALLBACK_MAX_CALLS:2}
      transport-retry-enabled: ${APP_PAPER_RECOGNITION_TRANSPORT_RETRY_ENABLED:true}
      transport-retry-max-count: ${APP_PAPER_RECOGNITION_TRANSPORT_RETRY_MAX_COUNT:1}
      transport-retry-backoff-base: ${APP_PAPER_RECOGNITION_TRANSPORT_RETRY_BACKOFF_BASE:1s}
      feedback-max-chars: ${APP_PAPER_RECOGNITION_FEEDBACK_MAX_CHARS:200}
    structure:
      # 结构切题分块并行；池大小是唯一并发旋钮
      pool-size: ${APP_PAPER_STRUCTURE_POOL_SIZE:2}
      queue-capacity: ${APP_PAPER_STRUCTURE_QUEUE_CAPACITY:20}
      rejection-policy: ${APP_PAPER_STRUCTURE_REJECTION_POLICY:abort}
      propagate-security-context: ${APP_PAPER_STRUCTURE_PROPAGATE_SECURITY_CONTEXT:true}
      propagate-ai-call-context: ${APP_PAPER_STRUCTURE_PROPAGATE_AI_CALL_CONTEXT:true}
    answer:
      # 答案键批次统一并行；池大小是唯一并发旋钮，设 1 即完全串行
      pool-size: ${APP_PAPER_ANSWER_POOL_SIZE:2}
      queue-capacity: ${APP_PAPER_ANSWER_QUEUE_CAPACITY:20}
      rejection-policy: ${APP_PAPER_ANSWER_REJECTION_POLICY:abort}
      propagate-security-context: ${APP_PAPER_ANSWER_PROPAGATE_SECURITY_CONTEXT:true}
      propagate-ai-call-context: ${APP_PAPER_ANSWER_PROPAGATE_AI_CALL_CONTEXT:true}
      # 解析每批题数；过小会增加 RPM 压力，过大会增加长 JSON 截断风险
      analysis-batch-size: ${APP_PAPER_ANALYSIS_BATCH_SIZE:3}
      # 当前分钟 RPM 已满时最多等待多久再继续；默认覆盖完整窗口
      analysis-rate-limit-max-wait: ${APP_PAPER_ANALYSIS_RATE_LIMIT_MAX_WAIT:65s}
      # 免费模型每批解析前的短冷却，降低连续批次触发上游 429 的概率
      # 默认不再强制每批等待 1 秒；429 由 Provider 共享冷却和重试处理
      analysis-free-model-cooldown: ${APP_PAPER_ANALYSIS_FREE_MODEL_COOLDOWN:0s}
      # 仍缺解析时只对缺失题补跑；补跑按单题顺序执行，计入同一限流闸门
      analysis-recovery-max-calls: ${APP_PAPER_ANALYSIS_RECOVERY_MAX_CALLS:4}
      analysis-recovery-max-wait: ${APP_PAPER_ANALYSIS_RECOVERY_MAX_WAIT:60s}
  # RustFS (S3兼容) 存储配置
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:}
    secret-key: ${APP_STORAGE_SECRET_KEY:}
    bucket: ${APP_STORAGE_BUCKET:smart-quiz}
    region: ${APP_STORAGE_REGION:us-east-1}
    api-call-timeout: ${APP_STORAGE_API_CALL_TIMEOUT:60s}
    api-call-attempt-timeout: ${APP_STORAGE_API_CALL_ATTEMPT_TIMEOUT:20s}
    auto-create-bucket: ${APP_STORAGE_AUTO_CREATE_BUCKET:true}
    path-style: ${APP_STORAGE_PATH_STYLE:true}

  document-parse:
    timeout: ${APP_DOCUMENT_PARSE_TIMEOUT:2m}
    pool-size: ${APP_DOCUMENT_PARSE_POOL_SIZE:2}
    queue-capacity: ${APP_DOCUMENT_PARSE_QUEUE_CAPACITY:20}
    rejection-policy: ${APP_DOCUMENT_PARSE_REJECTION_POLICY:abort}
    propagate-security-context: ${APP_DOCUMENT_PARSE_PROPAGATE_SECURITY_CONTEXT:true}
  
  # 卡住任务恢复调度（P1-07）：pending 阈值必须大于正常排队时间
  async:
    stream:
      pending-metrics-interval-ms: ${APP_STREAM_PENDING_METRICS_INTERVAL_MS:30000}
      defaults:
        worker-threads: ${APP_STREAM_DEFAULT_WORKER_THREADS:2}
        queue-capacity: ${APP_STREAM_DEFAULT_QUEUE_CAPACITY:20}
        drain-timeout: ${APP_STREAM_DEFAULT_DRAIN_TIMEOUT:10s}
        propagate-security-context: ${APP_STREAM_DEFAULT_PROPAGATE_SECURITY_CONTEXT:true}
      consumers:
        interview-question-gen:
          worker-threads: ${APP_STREAM_INTERVIEW_QUESTION_GEN_WORKERS:2}
          queue-capacity: ${APP_STREAM_INTERVIEW_QUESTION_GEN_QUEUE:20}
          drain-timeout: ${APP_STREAM_INTERVIEW_QUESTION_GEN_DRAIN:10s}
        interview-evaluate:
          worker-threads: ${APP_STREAM_INTERVIEW_EVALUATE_WORKERS:2}
          queue-capacity: ${APP_STREAM_INTERVIEW_EVALUATE_QUEUE:20}
          drain-timeout: ${APP_STREAM_INTERVIEW_EVALUATE_DRAIN:10s}
        paper-input:
          worker-threads: ${APP_STREAM_PAPER_INPUT_WORKERS:2}
          queue-capacity: ${APP_STREAM_PAPER_INPUT_QUEUE:10}
          drain-timeout: ${APP_STREAM_PAPER_INPUT_DRAIN:10s}
        paper-extract:
          worker-threads: ${APP_STREAM_PAPER_EXTRACT_WORKERS:2}
          queue-capacity: ${APP_STREAM_PAPER_EXTRACT_QUEUE:10}
          drain-timeout: ${APP_STREAM_PAPER_EXTRACT_DRAIN:10s}
        paper-recognition:
          worker-threads: ${APP_STREAM_PAPER_RECOGNITION_WORKERS:1}
          queue-capacity: ${APP_STREAM_PAPER_RECOGNITION_QUEUE:2}
          drain-timeout: ${APP_STREAM_PAPER_RECOGNITION_DRAIN:30s}
        knowledgebase-question-gen:
          worker-threads: ${APP_STREAM_KB_QUESTION_GEN_WORKERS:2}
          queue-capacity: ${APP_STREAM_KB_QUESTION_GEN_QUEUE:20}
          drain-timeout: ${APP_STREAM_KB_QUESTION_GEN_DRAIN:10s}
        knowledgebase-vectorize:
          worker-threads: ${APP_STREAM_KB_VECTORIZE_WORKERS:4}
          queue-capacity: ${APP_STREAM_KB_VECTORIZE_QUEUE:20}
          drain-timeout: ${APP_STREAM_KB_VECTORIZE_DRAIN:10s}
        voice-evaluate:
          worker-threads: ${APP_STREAM_VOICE_EVALUATE_WORKERS:1}
          queue-capacity: ${APP_STREAM_VOICE_EVALUATE_QUEUE:5}
          drain-timeout: ${APP_STREAM_VOICE_EVALUATE_DRAIN:10s}
    recovery:
      vectorize:
        enabled: ${APP_ASYNC_RECOVERY_VECTORIZE_ENABLED:true}
        pending-threshold: ${APP_ASYNC_RECOVERY_VECTORIZE_PENDING_THRESHOLD:10m}
        processing-threshold: ${APP_ASYNC_RECOVERY_VECTORIZE_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_VECTORIZE_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_VECTORIZE_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_VECTORIZE_BATCH_SIZE:10}
        max-recovery-count: ${APP_ASYNC_RECOVERY_VECTORIZE_MAX_RECOVERY_COUNT:3}
      resume-analyze:
        enabled: ${APP_ASYNC_RECOVERY_RESUME_ENABLED:true}
        pending-threshold: ${APP_ASYNC_RECOVERY_RESUME_PENDING_THRESHOLD:10m}
        processing-threshold: ${APP_ASYNC_RECOVERY_RESUME_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_RESUME_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_RESUME_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_RESUME_BATCH_SIZE:10}
        max-recovery-count: ${APP_ASYNC_RECOVERY_RESUME_MAX_RECOVERY_COUNT:3}
      question-gen:
        enabled: ${APP_ASYNC_RECOVERY_QUESTION_GEN_ENABLED:true}
        pending-threshold: ${APP_ASYNC_RECOVERY_QUESTION_GEN_PENDING_THRESHOLD:10m}
        processing-threshold: ${APP_ASYNC_RECOVERY_QUESTION_GEN_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_QUESTION_GEN_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_QUESTION_GEN_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_QUESTION_GEN_BATCH_SIZE:10}
        max-recovery-count: ${APP_ASYNC_RECOVERY_QUESTION_GEN_MAX_RECOVERY_COUNT:3}
      paper-input:
        enabled: ${APP_ASYNC_RECOVERY_PAPER_INPUT_ENABLED:true}
        pending-threshold: ${APP_ASYNC_RECOVERY_PAPER_INPUT_PENDING_THRESHOLD:10m}
        processing-threshold: ${APP_ASYNC_RECOVERY_PAPER_INPUT_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_PAPER_INPUT_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_PAPER_INPUT_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_PAPER_INPUT_BATCH_SIZE:10}
        max-recovery-count: ${APP_ASYNC_RECOVERY_PAPER_INPUT_MAX_RECOVERY_COUNT:3}
      interview-evaluate:
        enabled: ${APP_ASYNC_RECOVERY_INTERVIEW_EVALUATE_ENABLED:true}
        processing-threshold: ${APP_ASYNC_RECOVERY_INTERVIEW_EVALUATE_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_INTERVIEW_EVALUATE_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_INTERVIEW_EVALUATE_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_INTERVIEW_EVALUATE_BATCH_SIZE:20}

  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:80}

  # Voice interview configuration
  voice-interview:
    # 语音面试功能暂时下线（前端入口已移除）。置 true 可恢复后端 WebSocket 端点
    enabled: ${APP_VOICE_INTERVIEW_ENABLED:false}
    # 上下文压缩：enabled=false 是唯一关闭方式（仅本地排查用）；
    # enabled=true 时无论何种模式都执行字符硬预算（摘要 + 近期历史 <= max-history-chars）
    context-compression:
      enabled: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_ENABLED:true}
      mode: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MODE:SUMMARY}
      window-size: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_WINDOW_SIZE:20}
      summary-batch-size: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_SUMMARY_BATCH_SIZE:10}
      max-history-chars: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MAX_HISTORY_CHARS:12000}
      max-summary-chars: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MAX_SUMMARY_CHARS:4000}

    # Phase duration settings (minutes)
    phase:
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}

    # TTS configuration
    tts:
      default-voice: ${APP_VOICE_INTERVIEW_TTS_DEFAULT_VOICE:siyue}  # 思悦 - 温柔自然的女声

    # Qwen3 Realtime ASR Configuration
    qwen:
      # 音频调用在价格表中的 Provider 标识，默认与 DashScope 配置一致
      provider: ${APP_VOICE_QWEN_PROVIDER:dashscope}
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-asr-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        # 静音多久判为一句结束；中文面试思考停顿常见 2-3s，设 2000 避免句中切段
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}

      # Qwen TTS Realtime Configuration (WebSocket-based)
      # 音色列表文档：https://help.aliyun.com/zh/model-studio/qwen-tts-realtime
      tts:
        model: qwen3-tts-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        voice: Cherry
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60

    # 用户说完一小段 STT 定稿后，再等多久（毫秒）才触发面试官回复；需大于 VAD 静音阈值以确保用户继续说话时 partials 能取消
    user-utterance-debounce-ms: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:2500}
    # 触发提交前要求的最小静音时长（毫秒），从最后一次 STT 活动（含 partial）算起
    min-silence-before-commit-ms: ${APP_VOICE_MIN_SILENCE_BEFORE_COMMIT_MS:2500}
    # 当内容较短时先不提交，等待继续说（字符数）
    min-commit-chars: ${APP_VOICE_MIN_COMMIT_CHARS:20}
    # 最长等待用户继续补充的时间（毫秒），超时后强制提交
    max-wait-for-continuation-ms: ${APP_VOICE_MAX_WAIT_FOR_CONTINUATION_MS:7000}
    # 语音面试单轮面试官回复最大长度（字符）
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}
    # 是否按句子边合成边推送语音；开启后首段语音不用等待完整回复生成结束
    chunked-audio-enabled: ${APP_VOICE_CHUNKED_AUDIO_ENABLED:true}
    # 单句 TTS 合成超时，避免某一句卡住整轮播放
    tts-timeout-seconds: ${APP_VOICE_TTS_TIMEOUT_SECONDS:8}
    # TTS WebSocket 建连超时；必须小于单句合成超时，避免 SDK 握手失败后永久等待
    tts-connect-timeout-seconds: ${APP_VOICE_TTS_CONNECT_TIMEOUT_SECONDS:5}
    # 单会话并发 TTS 上限，控制首段语音速度和服务连接压力
    max-concurrent-tts-per-session: ${APP_VOICE_MAX_CONCURRENT_TTS_PER_SESSION:3}
    # 是否在应用启动时为开场白预热音频缓存；默认关闭，避免启动时产生云端 TTS 调用
    opening-audio-warmup-enabled: ${APP_VOICE_OPENING_AUDIO_WARMUP_ENABLED:false}

    # Rate limiting
    rate-limit:
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}  # messages per second
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}  # interviews per hour
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}  # global concurrent interviews

    # Audio specifications
    audio:
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
      chunk-duration: ${APP_VOICE_INTERVIEW_AUDIO_CHUNK_DURATION:2000}  # 2 seconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
