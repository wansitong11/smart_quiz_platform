app:
  voice-interview:
    opening:
      skill-questions:
        chinese: >
          你好，我是本次背诵与朗读练习的陪练老师。第一个环节：请朗读下面这段文字（或者你正在背的一篇课文），
          读完再用 1 分钟说说它的主旨和你最喜欢的句子，我会就其中的修辞与情感追问你。
        math: >
          你好，我是本次口头讲题练习的陪练老师。第一个环节：请挑一道你最近做过的数学题，
          按”已知条件、解题思路、关键步骤、易错点”讲给我听，本环节不需要写完整解答，我会追问你的推理依据。
        english: >
          你好，我是本次口语练习的陪练老师。第一个环节：请用英文朗读一段你熟悉的课文，
          然后用 1 分钟说说你对这段内容的看法，我会就你的用词和语法追问你。
      default-question: >
        你好，我是本次练习的陪练老师。第一个环节：请用 1 分钟口头说说你最近在学的知识点，
        按三点回答：学的是什么、你掌握到什么程度、还有哪里没弄明白。说完我会追问一个关键概念。
