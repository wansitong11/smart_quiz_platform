# ==============================================================================
# 低内存服务器（2G 级）覆盖文件
# 作用：
#   1. app / frontend 改用「只复制产物」的运行时镜像，服务器上不跑 Gradle 和 pnpm；
#   2. 给每个容器设硬内存上限，让 OOM 发生在容器自己的 cgroup 里，
#      不触发整机 OOM 影响同机其他服务；
#   3. 内存配额（2026-10-15 第二次事故复盘后重排）：
#      事故原因：容器 mem_limit 之和 1700MB > 机器实际可用内存 1613MB
#      （2GB 机器被 kdump 预留 256MB + 固件预留 ~130MB），于是宿主机先 OOM，
#      内核直接杀掉 app 的 java（613MB），随后整机僵死 3 小时。
#      现在把限额之和压到 1440MB（留给系统 + 页缓存约 400MB）：
#        app 832 + postgres 224 + rustfs 176 + redis 80 + frontend 48 + gateway 48 + certbot 32
#      app 的 JVM 上限之和 688MB（Xmx448 + Metaspace192 + Direct48）< 832m，留 ~140MB 余量。
# 用法：
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.server.yml \
#     --env-file deploy/env.prod up -d --build
# 前置：本地先构建好
#   app/build/libs/app.jar   （./gradlew :app:bootJar）
#   frontend/dist/           （cd frontend && pnpm run build）
# ==============================================================================
services:
  app:
    image: smart-quiz-app:local
    build:
      context: .
      dockerfile: deploy/server/Dockerfile.app
    mem_limit: 832m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xmx448m -XX:MaxMetaspaceSize=192m -XX:+UseParallelGC -XX:ActiveProcessorCount=2
        -XX:MaxDirectMemorySize=48m -XX:+ExitOnOutOfMemoryError
        -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8
      # 连接池保活与超时：避免连接被静默掐断后 postgres 后端异常退出
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: "120000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "900000"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "10000"
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: "3000"
  frontend:
    image: smart-quiz-frontend:local
    build:
      # 前端只依赖 dist + nginx.conf，上下文收窄到 frontend/（约 2MB），
      # 与 CI（context: frontend / file: frontend/Dockerfile）保持一致
      context: ./frontend
      dockerfile: Dockerfile
    mem_limit: 48m
  postgres:
    mem_limit: 224m
    # 只绑回环：方便通过 SSH 隧道接 GUI 客户端（DBeaver/Navicat）查看数据。
    # 绑的是 127.0.0.1，公网依然完全访问不到。
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
  redis:
    mem_limit: 80m
    ports:
      - "127.0.0.1:6379:6379"
  rustfs:
    mem_limit: 176m
    # 打开存储控制台（仅回环），配合 SSH 隧道可在浏览器里浏览对象
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9001:9001"
  gateway:
    mem_limit: 48m
  certbot:
    mem_limit: 32m
