# ==============================================================================
# 低内存服务器（2G 级）覆盖文件
# 作用：
#   1. app / frontend 改用「只复制产物」的运行时镜像，服务器上不跑 Gradle 和 pnpm；
#   2. 给每个容器设硬内存上限，让 OOM 发生在容器自己的 cgroup 里，
#      不触发整机 OOM 影响同机其他服务；
#   3. JVM 使用实测过的压缩参数（实测 RSS 约 300-450MB）。
# 用法：
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.server.yml \
#     --env-file deploy/env.prod up -d --build
# 前置：本地先构建好
#   app/build/libs/app.jar   （./gradlew :app:bootJar）
#   frontend/dist/           （cd frontend && pnpm run build）
# ==============================================================================
services:
  app:
    image: smart-quiz-app:local
    build:
      context: .
      dockerfile: deploy/server/Dockerfile.app
    mem_limit: 700m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:ActiveProcessorCount=1
        -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError
        -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8
  frontend:
    image: smart-quiz-frontend:local
    build:
      context: .
      dockerfile: deploy/server/Dockerfile.frontend
    mem_limit: 64m
  postgres:
    mem_limit: 256m
    # 只绑回环：方便通过 SSH 隧道接 GUI 客户端（DBeaver/Navicat）查看数据。
    # 绑的是 127.0.0.1，公网依然完全访问不到。
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
  redis:
    mem_limit: 96m
    ports:
      - "127.0.0.1:6379:6379"
  rustfs:
    mem_limit: 256m
    # 打开存储控制台（仅回环），配合 SSH 隧道可在浏览器里浏览对象
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9001:9001"
  gateway:
    mem_limit: 64m
  certbot:
    mem_limit: 64m
