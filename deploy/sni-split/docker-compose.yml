# SNI 分流器（独立于应用栈，独立生命周期）
#
# 关键点 network_mode: host
#   分流器要访问宿主机回环上的 127.0.0.1:10443（Xray）和 127.0.0.1:8443（应用网关）。
#   放在默认 bridge 网络里时，容器内的 127.0.0.1 是容器自己，转发必然失败。
#   host 网络还省掉一层 NAT，延迟最低。
#
# 用法：
#   cd /opt/sni-split
#   docker compose up -d                                  # 正式版，监听 443
#   SNI_SPLIT_CONF=nginx.dryrun.conf docker compose up -d # 干跑验证，监听 8443
#   docker compose logs -f

name: sni-split

services:
  sni-split:
    image: nginx:1.27-alpine
    container_name: sni-split
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./${SNI_SPLIT_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
