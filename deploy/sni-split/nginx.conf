# 443 SNI 分流器（阶段二：正式切换后使用）
#
# nginx 只读 ClientHello 里的 SNI，不解密也不终止 TLS，
# 按域名把 TCP 连接分给两个后端：
#   quiz.stonev2ray.top           -> 应用网关（TLS 由应用自己的 nginx 终止）
#   其它（含 sto1.stonev2ray.top） -> 现有 Xray

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name upstream=$upstream_name sent=$bytes_sent recv=$bytes_received time=$session_time';
    access_log /var/log/nginx/sni-access.log sni;

    # 应用网关：由 docker-compose.prod.yml 的 gateway 服务发布到宿主机回环
    upstream app_backend {
        server 127.0.0.1:8443;
    }

    # Xray：切换后监听这里
    upstream xray_backend {
        server 127.0.0.1:10443;
    }

    map $ssl_preread_server_name $upstream_name {
        # 精确匹配；以后要加域名在这里继续加行
        quiz.stonev2ray.top   app_backend;
        default               xray_backend;
    }

    server {
        listen 443;
        # 服务器有公网 IPv6 时再打开下面这行，否则 nginx 会因绑定失败起不来
        # listen [::]:443;

        ssl_preread on;
        proxy_pass $upstream_name;
        # 默认 16k，调大避免大带宽下成为瓶颈
        proxy_buffer_size 64k;
        # 默认只有 10 分钟，长连接空闲会被切断
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}
