# 443 SNI 分流器（阶段一：干跑验证，不动任何现有服务）
#
# 与正式版 nginx.conf 只差两处：
#   1. 监听 9443（8443 已是应用网关），避免和当前 Xray 抢 443
#   2. xray_backend 仍指向 127.0.0.1:443，也就是 Xray 现在的位置
#
# 验证通过后再换成 nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name upstream=$upstream_name sent=$bytes_sent recv=$bytes_received time=$session_time';
    access_log /var/log/nginx/sni-access.log sni;

    upstream app_backend {
        server 127.0.0.1:8443;
    }

    upstream xray_backend {
        server 127.0.0.1:443;
    }

    map $ssl_preread_server_name $upstream_name {
        quiz.stonev2ray.top   app_backend;
        default               xray_backend;
    }

    server {
        listen 9443;
        ssl_preread on;
        proxy_pass $upstream_name;
        proxy_buffer_size 64k;
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}
