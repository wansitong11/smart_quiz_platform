<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 智能刷题平台图标：翻开的书本 + 对勾 -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- 书页 -->
  <path d="M7 9.5c2.6-.9 5.1-.9 7.6.4v13.6c-2.5-1.3-5-1.3-7.6-.4V9.5z"
        fill="#ffffff" fill-opacity="0.95"/>
  <path d="M25 9.5c-2.6-.9-5.1-.9-7.6.4v13.6c2.5-1.3 5-1.3 7.6-.4V9.5z"
        fill="#ffffff" fill-opacity="0.78"/>

  <!-- 书脊 -->
  <path d="M16 9.9v14.2" stroke="#c7d2fe" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 对勾 -->
  <path d="M11.8 17.4l2.3 2.3 4.6-5"
        stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
</svg>
